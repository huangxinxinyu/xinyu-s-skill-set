<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的画像 · About me</title>
<style>
:root{--paper:#f5f3ed;--ink:#202d31;--muted:#68716e;--line:#dedfd5;--accent:#c94c2a;--green:#426957;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #c94c2a80;outline-offset:3px}button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 15px;color:var(--ink)}button:hover{background:#eae8e0}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button.primary:hover{background:#35484b}.shell{max-width:1240px;margin:auto;padding:0 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 0;border-bottom:1px solid var(--line)}.brand{font-weight:700;letter-spacing:2px;font-size:13px}.brand i{display:inline-block;background:var(--accent);width:10px;height:10px;border-radius:50%;margin-right:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:64px;padding:68px 0 56px}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:3px;font-weight:700}h1{font-size:clamp(42px,6vw,72px);line-height:1.15;letter-spacing:-3px;margin:20px 0 22px;font-weight:600}h1 span{color:var(--accent)}.intro{max-width:530px;color:var(--muted);font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.subtle{font-size:12px;color:var(--muted)}.text-button{border:0;padding:3px 0;color:var(--muted);text-decoration:underline;text-underline-offset:4px}.orbit{position:relative;min-height:270px;display:flex;align-items:center;justify-content:center}.orbit:before,.orbit:after{content:"";position:absolute;width:242px;height:242px;border:1px solid var(--line);border-radius:50%}.orbit:after{width:174px;height:174px}.center{z-index:1;width:105px;height:105px;background:var(--ink);border-radius:50%;display:grid;place-items:center;color:var(--white);font-size:27px;box-shadow:0 15px 35px #202d3117}.orbit-label{position:absolute;background:var(--paper);padding:3px 10px;font-size:12px;color:var(--muted);z-index:2}.north{top:1px;left:calc(50% - 25px)}.south{bottom:1px;left:calc(50% - 25px)}.east{right:calc(50% - 145px);top:calc(50% - 12px)}.west{left:calc(50% - 145px);top:calc(50% - 12px)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:38px}.metric{padding:20px 24px;border-right:1px solid var(--line);display:flex;gap:16px;align-items:baseline}.metric:first-child{padding-left:0}.metric:last-child{border-right:0}.metric strong{font-size:30px;font-weight:500}.metric span{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h2{font-size:22px;letter-spacing:-.5px;margin:0}.toolbar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:24px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;font-size:13px;padding:8px 15px}.tabs button[aria-pressed=true]{background:var(--ink);color:var(--white)}.search{display:flex;gap:10px;flex-wrap:wrap}.search input,.search select{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}.search input{width:190px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:24px;display:flex;flex-direction:column;min-height:230px;overflow-wrap:anywhere}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.category{font-size:11px;color:var(--muted);letter-spacing:2px}.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:#e8efe8;color:var(--green)}.badge.pending{background:#f7edde;color:#866c42}.card h3{font-size:19px;margin:20px 0 10px;line-height:1.4}.detail{font-size:14px;color:var(--muted);margin:0 0 20px;white-space:pre-wrap}.card-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:10px;justify-content:space-between;align-items:start}.card-bottom button{font-size:12px;padding:2px 7px;border:0;color:var(--muted)}details{font-size:12px;max-width:80%;color:var(--muted)}summary{cursor:pointer}details p{white-space:pre-wrap}.empty{grid-column:1/-1;padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.questions{margin:48px 0;background:#eaece3;border-radius:14px;padding:30px}.questions-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.questions h2{font-size:19px}.question{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid #d6dace;padding:16px 0;font-size:14px}.question:last-child{padding-bottom:0}.question button{font-size:12px;flex-shrink:0}.footer{display:flex;justify-content:space-between;gap:20px;padding:22px 0 30px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}dialog{width:min(540px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--white);color:var(--ink);max-height:90vh;overflow:auto}dialog::backdrop{background:#202d3160;backdrop-filter:blur(4px)}dialog h2{margin-bottom:20px}label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--white);color:var(--ink)}dialog textarea{resize:vertical;min-height:85px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:25px}.dialog-actions .delete{margin-right:auto;color:#a43520}.error{color:#a43520;font-size:12px;min-height:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:12px 22px;font-size:13px;z-index:10;box-shadow:0 10px 30px #0002;max-width:90vw}.hidden{display:none!important}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{gap:20px}.shell{padding:0 24px}.topbar{align-items:flex-start}.actions button{font-size:12px;padding:7px 10px}}@media(max-width:600px){.shell{padding:0 18px}.topbar{flex-direction:column}.hero{grid-template-columns:1fr;padding:40px 0 28px}.orbit{display:none}.cards{grid-template-columns:1fr}.metrics{margin-bottom:30px}.metric{padding:15px 8px;gap:6px;flex-direction:column}.metric strong{font-size:26px}.toolbar{align-items:stretch}.search{width:100%}.search input{flex:1;min-width:100px}.questions{padding:22px}.question{align-items:flex-start}.footer{flex-direction:column;gap:6px}h1{letter-spacing:-2px}.section-head{gap:10px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease both}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}@media print{.actions,.toolbar,.text-button,.section-head button,.card-bottom button,.question button,.toast,dialog,.footer button{display:none!important}.shell{padding:0}.hero{padding:25px 0}.cards{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}.questions{break-inside:avoid}body{background:white}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><i></i>ABOUT ME / 个人画像</div><div class="actions"><button id="import">导入画像</button><button id="export-json">导出 JSON</button><button id="export-html" class="primary">保存完整网页 ↗</button></div></header>
<main>
<section class="hero"><div><div class="eyebrow">A PORTRAIT IN PROGRESS</div><h1><span id="person-name"></span><br>不断认识自己。</h1><p id="person-intro" class="intro"></p><button id="edit-person" class="text-button">编辑名字与简介</button></div><div class="orbit" aria-hidden="true"><div class="center">我</div><div class="orbit-label north">兴趣</div><div class="orbit-label east">工作方式</div><div class="orbit-label south">目标</div><div class="orbit-label west">偏好</div></div></section>
<section class="metrics" aria-label="画像概况"><div class="metric"><strong id="count-all">0</strong><span>画像线索</span></div><div class="metric"><strong id="count-known">0</strong><span>已知信息</span></div><div class="metric"><strong id="count-pending">0</strong><span>待确认判断</span></div></section>
<section aria-labelledby="profile-heading"><div class="section-head"><div><h2 id="profile-heading">关于我的那些事</h2><div class="subtle">每条线索，都可以追溯与修正。</div></div><button id="add" class="primary">＋ 添加线索</button></div><div class="toolbar"><div class="tabs" aria-label="画像分类"><button data-category="全部" aria-pressed="true">全部</button><button data-category="兴趣" aria-pressed="false">兴趣</button><button data-category="工作方式" aria-pressed="false">工作方式</button><button data-category="偏好" aria-pressed="false">偏好</button><button data-category="目标" aria-pressed="false">目标</button></div><div class="search"><input id="search" type="search" aria-label="搜索画像" placeholder="搜索线索或依据…"><select id="status-filter" aria-label="筛选确认状态"><option value="全部">所有状态</option><option>已知</option><option>待确认</option></select></div></div><div id="cards" class="cards" aria-live="polite"></div></section>
<section class="questions" aria-labelledby="questions-heading"><div class="questions-head"><h2 id="questions-heading">再多认识自己一点</h2><span class="subtle">可以慢慢补充</span></div><div id="questions"></div></section>
</main>
<footer class="footer"><div id="save-status" role="status">数据仅在本地处理。导出网页可携带最新修改。</div><button id="reset" class="text-button">恢复打开时的画像</button></footer>
</div>
<input id="import-file" type="file" accept=".json,application/json" class="hidden" aria-label="选择画像 JSON">
<dialog id="entry-dialog"><form id="entry-form"><h2 id="entry-heading">添加线索</h2><div class="row"><div><label for="entry-category">分类</label><select id="entry-category"><option>兴趣</option><option>工作方式</option><option>偏好</option><option>目标</option></select></div><div><label for="entry-status">状态</label><select id="entry-status"><option>已知</option><option>待确认</option></select></div></div><label for="entry-title">一句话概括</label><input id="entry-title" required maxlength="100"><label for="entry-detail">具体描述</label><textarea id="entry-detail" maxlength="5000"></textarea><label for="entry-evidence">依据 / 原话 / 待确认原因</label><textarea id="entry-evidence" required maxlength="5000" placeholder="例如：我自己补充；2026-10-02 对话中的原话"></textarea><div id="entry-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" id="delete" class="delete hidden">删除线索</button><button type="button" data-close="entry-dialog">取消</button><button type="submit" class="primary">保存线索</button></div></form></dialog>
<dialog id="person-dialog"><form id="person-form"><h2>名字与简介</h2><label for="name-input">显示名字</label><input id="name-input" required maxlength="100"><label for="intro-input">简介</label><textarea id="intro-input" maxlength="5000"></textarea><div id="person-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" data-close="person-dialog">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script id="profile-data" type="application/json">__PROFILE_DATA__</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const categories = ['兴趣','工作方式','偏好','目标'];
const statuses = ['已知','待确认'];
const clone = data => JSON.parse(JSON.stringify(data));
function validate(data) {
  if (!data || typeof data !== 'object' || data.version !== 1 || !data.person || typeof data.person.name !== 'string' || typeof data.person.intro !== 'string' || !Array.isArray(data.entries) || !Array.isArray(data.questions) || !data.questions.every(q => typeof q === 'string')) throw Error('画像格式不正确，请导入本网页导出的 JSON。');
  const ids = new Set();
  for (const e of data.entries) {
    if (!e || !['id','category','title','detail','status','evidence'].every(k => typeof e[k] === 'string') || !e.id.trim() || ids.has(e.id) || !e.title.trim() || !e.evidence.trim() || !categories.includes(e.category) || !statuses.includes(e.status)) throw Error('画像条目缺少必要信息，或存在重复 ID。');
    ids.add(e.id);
  }
  return data;
}
const seed = validate(JSON.parse($('profile-data').textContent));
let hash = 2166136261;
for (const c of JSON.stringify(seed)) hash = Math.imul(hash ^ c.charCodeAt(0), 16777619);
const storageKey = 'personal-profile-v1-' + (hash >>> 0).toString(16);
let data = clone(seed), storageAvailable = true, selectedCategory = '全部', editingId = null, toastTimer;
try { const saved = localStorage.getItem(storageKey); if (saved) data = validate(JSON.parse(saved)); }
catch (_) { storageAvailable = false; }
function notify(message) { $('toast').textContent = message; $('toast').classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 3500); }
function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify(data)); storageAvailable = true; }
  catch (_) { storageAvailable = false; }
  render();
  if (!storageAvailable) notify('浏览器暂存不可用，请用「保存完整网页」保留修改。');
}
function element(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; if (text !== undefined) el.textContent = text; return el; }
function render() {
  $('person-name').textContent = data.person.name || '我的画像';
  $('person-intro').textContent = data.person.intro;
  document.title = (data.person.name || '我的画像') + ' · 个人画像';
  $('count-all').textContent = data.entries.length;
  $('count-known').textContent = data.entries.filter(e => e.status === '已知').length;
  $('count-pending').textContent = data.entries.filter(e => e.status === '待确认').length;
  const query = $('search').value.trim().toLocaleLowerCase();
  const visible = data.entries.filter(e => (selectedCategory === '全部' || e.category === selectedCategory) && ($('status-filter').value === '全部' || e.status === $('status-filter').value) && [e.title,e.detail,e.evidence].some(t => t.toLocaleLowerCase().includes(query)));
  const cards = $('cards'); cards.replaceChildren();
  if (!visible.length) cards.append(element('div','empty','这里还没有线索。试试其他筛选，或添加一条关于你的信息。'));
  for (const e of visible) {
    const card = element('article','card');
    const top = element('div','card-top'); top.append(element('span','category',e.category),element('span','badge' + (e.status === '待确认' ? ' pending' : ''),e.status));
    card.append(top,element('h3','',e.title),element('p','detail',e.detail));
    const bottom = element('div','card-bottom'); const evidence = element('details');
    evidence.append(element('summary','','查看依据'),element('p','',e.evidence));
    const edit = element('button','','编辑'); edit.setAttribute('aria-label','编辑：' + e.title); edit.addEventListener('click',() => openEntry(e));
    bottom.append(evidence,edit); card.append(bottom); cards.append(card);
  }
  $('questions').replaceChildren();
  const questions = data.questions.length ? data.questions : ['最近有什么新发现，想写进你的画像？'];
  for (const q of questions) {
    const row = element('div','question'); const answer = element('button','','补充回答 ↗');
    answer.addEventListener('click',() => openEntry(null,q)); row.append(element('span','',q),answer); $('questions').append(row);
  }
  $('save-status').textContent = storageAvailable ? '修改会暂存在当前浏览器；导出完整网页可携带最新画像。全程无需联网。' : '浏览器暂存不可用；请导出完整网页或 JSON 保留修改。';
}
function openEntry(entry = null, question = '') {
  editingId = entry ? entry.id : null;
  $('entry-heading').textContent = entry ? '编辑线索' : '添加线索';
  $('entry-category').value = entry ? entry.category : '兴趣';
  $('entry-status').value = entry ? entry.status : '已知';
  $('entry-title').value = entry ? entry.title : '';
  $('entry-detail').value = entry ? entry.detail : '';
  $('entry-evidence').value = entry ? entry.evidence : (question ? '本人补充，回答：' + question : '本人补充');
  $('entry-error').textContent = '';
  $('delete').classList.toggle('hidden',!entry);
  $('entry-dialog').showModal(); $('entry-title').focus();
}
$('entry-form').addEventListener('submit', event => {
  event.preventDefault();
  const title = $('entry-title').value.trim(), evidence = $('entry-evidence').value.trim();
  if (!title || !evidence) { $('entry-error').textContent = '请填写标题和依据，不能只输入空格。'; return; }
  const entry = {id:editingId || 'local-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2),category:$('entry-category').value,title,detail:$('entry-detail').value.trim(),status:$('entry-status').value,evidence};
  if (editingId) data.entries = data.entries.map(e => e.id === editingId ? entry : e); else data.entries.push(entry);
  $('entry-dialog').close(); persist(); notify(storageAvailable ? '线索已保存到当前浏览器。' : '线索已更新，请导出保留。');
});
$('delete').addEventListener('click',() => { if (confirm('删除这条画像线索？')) { data.entries = data.entries.filter(e => e.id !== editingId); $('entry-dialog').close(); persist(); } });
$('add').addEventListener('click',() => openEntry());
$('edit-person').addEventListener('click',() => { $('name-input').value=data.person.name; $('intro-input').value=data.person.intro; $('person-error').textContent=''; $('person-dialog').showModal(); });
$('person-form').addEventListener('submit',event => { event.preventDefault(); if (!$('name-input').value.trim()) { $('person-error').textContent='请填写名字，不能只输入空格。'; return; } data.person={name:$('name-input').value.trim(),intro:$('intro-input').value.trim()}; $('person-dialog').close(); persist(); });
document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click',() => $(button.dataset.close).close()));
document.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click',() => { selectedCategory=button.dataset.category; document.querySelectorAll('[data-category]').forEach(b => b.setAttribute('aria-pressed',String(b===button))); render(); }));
$('search').addEventListener('input',render); $('status-filter').addEventListener('change',render);
function download(name, content, type) { const url = URL.createObjectURL(new Blob([content],{type})); const a = element('a'); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url),1500); }
function escapedJSON(value) { return JSON.stringify(value,null,2).replace(/&/g,'\\u0026').replace(/</g,'\\u003c').replace(/>/g,'\\u003e'); }
$('export-json').addEventListener('click',() => download('personal-profile.json',JSON.stringify(data,null,2),'application/json'));
$('export-html').addEventListener('click',() => {
  const doc = document.documentElement.cloneNode(true);
  doc.querySelector('#profile-data').textContent=escapedJSON(data);
  doc.querySelectorAll('dialog').forEach(d => d.removeAttribute('open'));
  doc.querySelector('#toast').classList.add('hidden');
  doc.querySelector('#search').setAttribute('value','');
  doc.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category==='全部')));
  download('personal-profile.html','<!doctype html>\n'+doc.outerHTML,'text/html'); notify('完整网页已导出，包含当前画像。');
});
$('import').addEventListener('click',() => $('import-file').click());
$('import-file').addEventListener('change',async event => {
  const file = event.target.files[0]; if (!file) return;
  try { if (file.size > 2*1024*1024) throw Error('请选择小于 2 MB 的画像 JSON。'); const imported = validate(JSON.parse(await file.text())); if (confirm('用导入的画像替换当前画像？建议先导出当前版本。')) { data=clone(imported); persist(); notify(storageAvailable ? '画像已导入。' : '画像已导入，请导出保留。'); } }
  catch(error) { notify('导入失败：' + error.message); }
  finally { event.target.value=''; }
});
$('reset').addEventListener('click',() => { if (confirm('恢复此网页内最初的画像？当前修改会被替换。')) { data=clone(seed); persist(); notify('已恢复打开时的画像。'); } });
render();
</script>
</body>
</html>
