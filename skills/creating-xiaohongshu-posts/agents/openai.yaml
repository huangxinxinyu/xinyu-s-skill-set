interface:
  display_name: "小红书内容创作"
  short_description: "创作自然具体的小红书内容，并在需要时通过 MCP 完成发布"
  default_prompt: "Use $creating-xiaohongshu-posts to turn these notes into a Xiaohongshu post and prepare it for publishing."

dependencies:
  tools:
    - type: "mcp"
      value: "xiaohongshu"
      description: "Local Xiaohongshu MCP server for account access and publishing"
      transport: "streamable_http"
      url: "http://127.0.0.1:18060/mcp"

policy:
  allow_implicit_invocation: true
